parameters:
  - name: nanoClrToolUsePreview
    displayName: Include preview nanoCLR .NET tool packages
    type: boolean
    default: false
  - name: nanoClrInstanceUsePreview
    displayName: Include preview native nanoCLR instances
    type: boolean
    default: false

trigger:
  branches:
    include:
      - main
      - develop
      - release-*
  paths:
    exclude:
      - .gitignore
      - .editorconfig
      - .gitattributes
      - .gitmodules
      - spelling_exclusion.dic
      - LICENSE.md
      - README.md
      - NuGet.Config
      - assets/*
      - config/*
      - .github/*
      - azure-pipelines-templates/*
      - native/*
      - MetadataProcessor.Tests/mscorlib/*

  tags:
    include:
      - v*

# PR always trigger build
pr:
  autoCancel: true

# add nf-tools repo to resources (for Azure Pipelines templates)
resources:
  repositories:
    - repository: templates
      type: github
      name: nanoframework/nf-tools
      endpoint: nanoframework

variables:
  - name: DOTNET_NOLOGO
    value: true
  - name: nugetPackageName
    value: 'nanoFramework.Tools.MetadataProcessor.MsBuildTask'
      
jobs:

##############################
- job: Build_Prep
  pool:
    vmImage: 'windows-latest'

  steps:
  - checkout: self
    fetchDepth: 1
    

  # get commit message
  - powershell: |

      # default to false
      $update = $false

      # compute authorization header in format "AUTHORIZATION: basic 'encoded token'"
      # 'encoded token' is the Base64 of the string "nfbot:personal-token"
      $auth = "basic $([System.Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("nfbot:$(GitHubToken)")))"

      if($env:System_PullRequest_PullRequestNumber -ne $null)
      {
        # PR build

        # find PR
        "Getting PR #$env:System_PullRequest_PullRequestNumber details..." | Write-Host -ForegroundColor White -NoNewline
        $pr = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:Build_Repository_Name/pulls/$env:System_PullRequest_PullRequestNumber" -Header @{"Authorization"="$auth"} -ContentType "application/json" -Method GET
      }
      else
      {
        # build is not from a PR

        # get commit ID
        $commitId = git rev-parse HEAD
        
        # get PR associate with commit
        $prUrl = "https://api.github.com/repos/nanoframework/metadata-processor/commits/$commitId/pulls"
        $commit = Invoke-RestMethod -Uri $prUrl -ContentType "application/json" -Header @{"Authorization"="$auth"} -Method GET

        if($commit -ne $null)
        {
          # there is a PR, check labels
          $updateDependents = $commit.labels | where {$_.Name -eq 'CI: Update Dependents'}
          if($updateDependents -ne $null)
          {
            $update = $true
          }
        }
        else
        {
          # not a PR, get subject and commit message for commit
          $commitMessage = git log --format='%B' -1

          # need to flatten message by removing new lines
          $commitMessage = $commitMessage -replace "`r`n", " "

          if($commitMessage -like "***UPDATE_DEPENDENTS***")
          {
            $update = $true
          }
        }
      }

      # set variables to forward to jobs
      echo "##vso[task.setvariable variable=RUN_UPDATE_DEPENDENTS;isOutput=true]$update"
    name: GetPRLabels
    displayName:  Check build conditions

##############################
# build MDP
- job: Build_MDP
  condition: 
    and(
      not(startsWith(variables['Build.SourceBranch'], 'refs/tags/v')),
      eq(variables['UPDATE_DEPENDENTS'], 'false')
    )    

  dependsOn:
    - Build_Prep

  pool:
    vmImage: 'windows-latest'

  variables:
    - group: sign-client-credentials
    - name: buildPlatform
      value: 'Any CPU'  
    - name: buildConfiguration
      value: 'Release'
    - name: solution
      value: 'nanoFramework.Tools.MetadataProcessor.sln'
    - name: NF_MDP_MSBUILDTASK_PATH
      value: '$(System.DefaultWorkingDirectory)/MetadataProcessor.MsBuildTask/bin/Release/net472'
    - name: NF_MDP_NANOCLR_INSTANCE_PATH
      value: ''
    - name: NF_MDP_NANOCLR_TOOL_USE_PREVIEW
      value: ${{ parameters.nanoClrToolUsePreview }}
    - name: NF_MDP_NANOCLR_INSTANCE_USE_PREVIEW
      value: ${{ parameters.nanoClrInstanceUsePreview }}

  steps:

  # need this here in order to persist GitHub credentials, do a shallow fetch AND init submodules
  - checkout: self
    persistCredentials: true
    submodules: true

  - script: |
      cd $(System.DefaultWorkingDirectory)/MetadataProcessor.Tests/mscorlib
      git submodule update --init --recursive
    displayName: Update mscorlib sub-module

  - script: |
      git config --global user.email "nanoframework@outlook.com"
      git config --global user.name "nfbot"
    displayName: Setup git identity

  - template: azure-pipelines-templates/install-nuget.yml@templates

  - task: InstallNanoMSBuildComponents@1
    condition: ne( variables['StartReleaseCandidate'], true )
    displayName: Install nanoFramework MSBuild components
    inputs:
      GitHubToken: $(GitHubToken)
      usePreview: true


  - template: azure-pipelines-templates/check-nf-interpreter-to-test.yml

  - task: UseDotNet@2
    displayName: Install .NET 10 SDK
    inputs:
      packageType: sdk
      version: '10.0.4xx'

  - task: NuGetCommand@2
    displayName: NuGet restore
    inputs:
      restoreSolution: '$(solution)'
      feedsToUse: config
      nugetConfigPath: 'NuGet.config'

  - pwsh: |
      $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
      $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild `
        -version '[18.0,19.0)' -find 'MSBuild\Current\Bin\amd64\MSBuild.exe'
      if (!$msbuild) {
        throw 'Building MDP with the .NET 10.0.4xx SDK requires an agent with Visual Studio 2026 / MSBuild 18.'
      }
      & $msbuild "$(solution)" "/p:Platform=$(buildPlatform)" `
        "/p:Configuration=$(buildConfiguration)" /p:PublicRelease=true /m /nr:false
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    displayName: Build with MSBuild 18 x64

  - task: PowerShell@2
    displayName: Remove test framework from mscorlib
    inputs:
      targetType: 'inline'
      script: |
        Remove-Item -Path $env:System_DefaultWorkingDirectory\MetadataProcessor.Tests\mscorlib\nanoFramework.TestFramework -Recurse -Force

  - task: PowerShell@2
    condition: >-
      and(
        succeeded(),
        ne(variables['System.PullRequest.PullRequestNumber'], '')
      )
    displayName: Select nanoCLR tool and instance channels
    inputs:
      targetType: inline
      script: |
        $isDevelopCi = ($env:BUILD_REASON -ne 'Manual') -and (
          $env:BUILD_SOURCEBRANCH -eq 'refs/heads/develop' -or
          $env:SYSTEM_PULLREQUEST_TARGETBRANCH -in @('develop', 'refs/heads/develop'))
        if ($isDevelopCi)
        {
          Write-Host 'Using preview nanoCLR .NET tool packages and native instances for develop CI.'
          Write-Host '##vso[task.setvariable variable=NF_MDP_NANOCLR_TOOL_USE_PREVIEW]true'
          Write-Host '##vso[task.setvariable variable=NF_MDP_NANOCLR_INSTANCE_USE_PREVIEW]true'
        }

  - task: UseDotNet@2
    condition: >-
      and(
        succeeded(),
        ne(variables['System.PullRequest.PullRequestNumber'], '')
      )
    displayName: Install .NET SDK
    inputs:
      packageType: sdk
      version: '10.x'

  - task: PowerShell@2
    condition: >-
      and(
        succeeded(),
        ne(variables['System.PullRequest.PullRequestNumber'], '')
      )
    displayName: Install nanoCLR tool
    inputs:
      targetType: inline
      script: |
        $toolPath = Join-Path '$(Agent.TempDirectory)' 'nanoclr'
        $usePreviewTool = [bool]::Parse($env:NF_MDP_NANOCLR_TOOL_USE_PREVIEW)
        $toolArguments = @('tool', 'install', 'nanoclr', '--tool-path', $toolPath)
        if ($usePreviewTool)
        {
          $toolArguments += '--prerelease'
        }

        Write-Host "Installing nanoCLR .NET tool (include preview packages: $usePreviewTool)"
        dotnet @toolArguments
        if ($LASTEXITCODE -ne 0)
        {
          throw "nanoCLR tool installation failed with exit code $LASTEXITCODE."
        }

        Write-Host "##vso[task.prependpath]$toolPath"
        & (Join-Path $toolPath 'nanoclr.exe') --version
        if ($LASTEXITCODE -ne 0)
        {
          throw "nanoCLR tool failed to start with exit code $LASTEXITCODE."
        }
    env:
      NF_MDP_NANOCLR_TOOL_USE_PREVIEW: $(NF_MDP_NANOCLR_TOOL_USE_PREVIEW)

  - task: VisualStudioTestPlatformInstaller@1
    condition: succeeded()
    displayName: 'Visual Studio Test Platform Installer'
    inputs:
      versionSelector: latestStable

  - task: VSTest@2
    condition: >-
      and(
        succeeded(),
        ne(variables['System.PullRequest.PullRequestNumber'], '')
      )
    displayName: 'Running tests'
    inputs:
      testSelector: 'testAssemblies'
      pathtoCustomTestAdapters: 
      testAssemblyVer2: |
        **\NFUnitTest.dll
        **\*Tests*.dll
        !**\obj\**
        !**\TestAdapter\**
        !**\NFUnitTest_DummyAdapter\**
        !**\nanoFramework.TestFramework\**
      searchFolder: '$(System.DefaultWorkingDirectory)'
      platform: '$(BuildPlatform)'
      configuration: '$(BuildConfiguration)'
      diagnosticsEnabled: true
      otherConsoleOptions: '/Logger:"console;verbosity=detailed"'
      vsTestVersion: toolsInstaller
      codeCoverageEnabled: true
    env:
      NF_MDP_NANOCLR_INSTANCE_PATH: $(NF_MDP_NANOCLR_INSTANCE_PATH)
      NF_MDP_NANOCLR_INSTANCE_USE_PREVIEW: $(NF_MDP_NANOCLR_INSTANCE_USE_PREVIEW)

  - powershell: |
      dotnet tool install --global dotnet-coverage
      $coverageFiles = Get-ChildItem -Path "$(Agent.TempDirectory)/TestResults" -Filter *.coverage -Recurse
      if ($coverageFiles) {
        dotnet-coverage merge $coverageFiles.FullName -f cobertura -o "$(Agent.TempDirectory)/CoverageReport/coverage.cobertura.xml"
      }
    displayName: Convert code coverage to Cobertura
    condition: >-
      and(
        succeededOrFailed(),
        ne(variables['System.PullRequest.PullRequestNumber'], '')
      )

  - task: PublishCodeCoverageResults@2
    condition: >-
      and(
        succeededOrFailed(),
        ne(variables['System.PullRequest.PullRequestNumber'], '')
      )
    displayName: Publish code coverage results
    inputs:
      summaryFileLocation: '$(Agent.TempDirectory)/CoverageReport/coverage.cobertura.xml'
      failIfCoverageEmpty: false

  - task: PublishPipelineArtifact@1
    condition: >-
      and(
        succeededOrFailed(),
        ne(variables['System.PullRequest.PullRequestNumber'], '')
      )
    displayName: Publish code coverage reports
    inputs:
      targetPath: '$(Agent.TempDirectory)/TestResults'
      artifactName: CodeCoverage
      artifactType: pipeline

  - task: CopyFiles@1
    condition: failed()
    displayName: Collecting test results
    inputs:
      Contents: |
        **\TestResults\*.trx
      TargetFolder: '$(Build.ArtifactStagingDirectory)'
      flattenFolders: true

  - task: CopyFiles@2
    condition: succeededOrFailed()
    displayName: Copy vstest dump files
    inputs:
      SourceFolder: 'D:\a\_temp\'
      Contents: "**/*.dmp"
      TargetFolder: "$(Build.ArtifactStagingDirectory)/vstest_dumps"
      flattenFolders: true

  - powershell: |
      $dumpPath = "$(Build.ArtifactStagingDirectory)/vstest_dumps"
      $hasFiles = $false

      if (Test-Path $dumpPath -PathType Container) {
          $fileCount = (Get-ChildItem $dumpPath -File | Measure-Object).Count
          $hasFiles = $fileCount -gt 0
      }
      echo "##vso[task.setvariable variable=hasFiles;isOutput=true]$hasFiles"
    displayName: "Check for dump files"
    name: checkFiles

  - task: PublishPipelineArtifact@1
    condition: eq(variables['hasFiles'], 'true')
    displayName: Publish vstest dump files
    inputs:
      targetPath: "$(Build.ArtifactStagingDirectory)/vstest_dumps"
      artifactName: VsTestCrashDumps
      artifactType: pipeline

  - task: CopyFiles@1
    condition: succeeded()
    displayName: Collecting deployable artifacts
    inputs:
      sourceFolder: $(Build.SourcesDirectory)
      Contents: |
        **\bin\Release\nanoFramework.Tools.MetaDataProcessor.exe
        **\bin\Release\net472\nanoFramework.Tools.MetadataProcessor.MsBuildTask.dll
      TargetFolder: '$(Build.ArtifactStagingDirectory)'
      flattenFolders: true

  # set cloud build vars again as they've been overwritten by the tests run
  - script: nbgv cloud -a -c
    condition: succeeded()
    displayName: Set build number

  - task: PowerShell@2
    condition: succeeded()
    displayName: Save cloud build number
    inputs:
      targetType: 'inline'
      script: Write-Host "$("##vso[build.updatebuildnumber]")$env:NBGV_NuGetPackageVersion"

  - task: NuGetCommand@2
    condition: succeeded()
    displayName: Pack NuGet with MetadataProcessor Console
    inputs:
      command: 'custom'
      arguments: 'pack MetadataProcessor.Console\package.nuspec -Version $(NBGV_NuGetPackageVersion) -properties "configuration=$(buildConfiguration);commit=$(Build.SourceVersion);NoWarn=NU5100"'

  - pwsh: |
      $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
      $frameworkHosts = @(& $vswhere -all -products '*' -requires Microsoft.Component.MSBuild `
        -version '[16.11,19.0)' -find 'MSBuild\Current\Bin\MSBuild.exe')
      $frameworkHosts += @(& $vswhere -all -products '*' -requires Microsoft.Component.MSBuild `
        -version '[16.11,19.0)' -find 'MSBuild\Current\Bin\amd64\MSBuild.exe')
      if (!$frameworkHosts.Count) { throw 'No Framework MSBuild host was found for package qualification.' }
      $sdkVersion = dotnet --version
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      $sdkLine = dotnet --list-sdks | Where-Object { $_ -like "$sdkVersion *" } | Select-Object -First 1
      $sdkRoot = [regex]::Match($sdkLine, '\[(.+)\]').Groups[1].Value
      if (!$sdkRoot) { throw 'Cannot locate the selected .NET SDK for package qualification.' }
      $hosts = @($frameworkHosts | Sort-Object -Unique) + (Join-Path $sdkRoot "$sdkVersion\MSBuild.dll")
      .\eng\Verify-MdpPackage.ps1 `
        -TaskPackage ".\MetadataProcessor.MsBuildTask\bin\$(buildConfiguration)\nanoFramework.Tools.MetadataProcessor.MsBuildTask.$(NBGV_NuGetPackageVersion).nupkg" `
        -CliPackage ".\nanoFramework.Tools.MetadataProcessor.CLI.$(NBGV_NuGetPackageVersion).nupkg" `
        -MSBuild $hosts
    condition: succeeded()
    displayName: Qualify task and console packages before signing

  - task: CopyFiles@1
    condition: succeeded()
    displayName: Collecting NuGet package artifact
    inputs:
      sourceFolder: $(Build.SourcesDirectory)
      Contents: |
        **\nanoFramework.Tools*.nupkg
      TargetFolder: '$(Build.ArtifactStagingDirectory)'
      flattenFolders: true

  - task: DotNetCoreCLI@2
    displayName: Install Sign Client CLI
    condition: >-
      and(
        succeeded(),
        eq(variables['UPDATE_DEPENDENTS'], 'false')
      )
    inputs:
      command: custom
      custom: tool
      arguments: install --tool-path . sign --version 0.9.1-beta.24170.3

  - pwsh: |
      .\sign code azure-key-vault `
      "**/*.nupkg" `
      --base-directory "$(Build.ArtifactStagingDirectory)" `
      --description ".NET nanoFramework MDP" `
      --description-url "https://github.com/$env:Build_Repository_Name" `
      --azure-key-vault-tenant-id "$(SignTenantId)" `
      --azure-key-vault-client-id "$(SignClientId)" `
      --azure-key-vault-client-secret "$(SignClientSecret)" `
      --azure-key-vault-certificate "$(SignKeyVaultCertificate)" `
      --azure-key-vault-url "$(SignKeyVaultUrl)" `
      --timestamp-url http://timestamp.digicert.com
    displayName: Sign packages
    continueOnError: true
    condition: >-
      and(
        succeeded(),
        eq(variables['UPDATE_DEPENDENTS'], 'false')
      )

  # publish artifacts (only possible if this is not a PR originated on a fork)
  - task: PublishPipelineArtifact@1
    condition: >-
      and(
        succeeded(),
        ne(variables['UPDATE_DEPENDENTS'], 'true')
      )  
    displayName: Publish deployables artifacts
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)'
      artifactName: deployables

  # push NuGet packages to NuGet (always happens except on PR builds)
  - task: NuGetCommand@2
    displayName: Push NuGet packages to NuGet
    condition: >-
      and(
        succeeded(),
        eq(variables['System.PullRequest.PullRequestId'], ''),
        ne(variables['UPDATE_DEPENDENTS'], 'true')
      )
    continueOnError: true
    inputs:
      command: push
      nuGetFeedType: external
      allowPackageConflicts: true
      packagesToPush: '$(Build.ArtifactStagingDirectory)/*.nupkg'
      publishFeedCredentials: 'NuGet-$(System.TeamProject)'

  # create or update GitHub release
  - task: GithubRelease@1
    condition: >-
      and(
        succeeded(),
        eq(variables['System.PullRequest.PullRequestId'], ''),
        eq(variables['UPDATE_DEPENDENTS'], 'false')
      )
    displayName: Create/Update GitHub release
    inputs:
      gitHubConnection: 'github.com_nano-$(System.TeamProject)'
      tagSource: userSpecifiedTag
      tag: v$(NBGV_NuGetPackageVersion)
      title: 'v$(NBGV_NuGetPackageVersion)'
      assets: '$(Build.ArtifactStagingDirectory)/*'
      isPreRelease: false
      action: create
      isDraft: false
      addChangeLog: true
      changeLogType: issueBased
      changeLogLabels: |
        [
          { "label": "Type: bug", "displayName": "Bugs fixed", "state": "closed" },
          { "label": "Type: enhancement", "displayName": "Enhancements and new features", "state": "closed" },
          { "label": "Breaking-Change", "displayName": "Breaking Changes", "state": "closed" },
          { "label": "Type: dependencies", "displayName": "Dependencies updated", "state": "closed" },
          { "label": "Type: documentation", "displayName": "Documentation", "state": "closed" }
        ]

##############################
- job: Update_Dependents
  condition: >-
    or(
      startsWith(variables['Build.SourceBranch'], 'refs/tags/v'),
      eq(variables['UPDATE_DEPENDENTS'], 'true'),
      eq(dependencies.Build_Prep.outputs['GetPRLabels.RUN_UPDATE_DEPENDENTS'], 'true')
    )

  dependsOn:
    - Build_Prep
    - Build_MDP

  pool:
    vmImage: 'windows-latest'

  steps:
  # need this here in order to persist GitHub credentials 
  - checkout: self
    fetchDepth: 1

  # update dependencies
  - task: PowerShell@2
    displayName: Update dependent class libs
    inputs:
      targetType: filePath
      filePath: azure-pipelines/update-dependents.ps1
    env:
      GITHUB_TOKEN: $(GitHubToken)
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

##################################
# report build failure to Discord
- job: Report_Build_Failure
  dependsOn:
  - Build_MDP
  condition: failed('Build_MDP')

  pool:
    vmImage: 'windows-latest'

  steps:

  - checkout: self
    fetchDepth: 1

  # step from template @ nf-tools repo
  - template: azure-pipelines-templates/discord-webhook.yml@templates
    parameters:
      status: 'failure'
      webhookUrl: '$(DiscordWebhook)'
      message: ''
